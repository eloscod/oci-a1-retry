name: OCI A1.Flex Capacity Retry

on:
  schedule:
    # Runs every 15 minutes. GitHub's minimum interval is 5 minutes;
    # 15 keeps you well within free Action minutes for private repos.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

jobs:
  try-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          pip install --upgrade oci-cli

      - name: Set up OCI config and key files
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config
          echo "SUPPRESS_LABEL_WARNING=True" >> "$GITHUB_ENV"
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> "$GITHUB_ENV"

      - name: Attempt instance launch
        id: attempt
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          chmod +x single_attempt.sh
          ./single_attempt.sh

      - name: Open issue with instance details on success
        if: steps.attempt.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('instance_result.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✅ A1.Flex instance launched!',
              body: '```\n' + result + '\n```'
            });

      - name: Read result for email body
        if: steps.attempt.outputs.found == 'true'
        id: readresult
        run: |
          {
            echo 'body<<EOF'
            cat instance_result.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send email notification on success
        if: steps.attempt.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Your OCI A1.Flex instance is live!"
          to: ${{ secrets.MAIL_TO }}
          from: OCI Retry Bot
          body: ${{ steps.readresult.outputs.body }}

      - name: Disable schedule after success
        if: steps.attempt.outputs.found == 'true'
        run: |
          echo "Instance launched — no further scheduled runs needed."
          echo "You can now disable this workflow from the Actions tab if you like."
